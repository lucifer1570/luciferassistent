services:
  - type: worker
    name: plan-bot
    env: python
    numInstances: 1
    buildCommand: pip install -r requirements.txt
    startCommand: python plan_bot.py
    envVars:
      - key: BOT_TOKEN
        sync: false   # Set this in the Render dashboard
      - key: GROUP_IDS
        sync: false   # Optional: comma-separated group IDs, e.g., -100123,-100456
